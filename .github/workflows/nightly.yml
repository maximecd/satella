name: Nightly

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

concurrency:
  group: satella-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly:
    name: nightly
    if: >-
      ${{ github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - uses: pnpm/action-setup@v4
      - name: Resolve the nightly version from release tags
        run: |
          VERSION="$(node scripts/release-version.mjs next-nightly)"
          echo "Packaging nightly ${VERSION} for commit ${COMMIT_SHA}."
          echo "NIGHTLY_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - run: vp run -r build
      - name: Pack the npm tarball
        run: |
          pnpm release:package --version "$NIGHTLY_VERSION" \
            --output-dir "$RUNNER_TEMP/satella-nightly"
      - name: Smoke-test the packed CLI
        run: |
          pnpm release:smoke --artifact \
            "$RUNNER_TEMP/satella-nightly/satella-app-${NIGHTLY_VERSION}.tgz"
      - name: Tag and publish the immutable nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${NIGHTLY_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${COMMIT_SHA}" -m "Satella Nightly ${NIGHTLY_VERSION}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            "$RUNNER_TEMP/satella-nightly/satella-app-${NIGHTLY_VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "Satella Nightly ${NIGHTLY_VERSION} ($(git rev-parse --short "$COMMIT_SHA"))" \
            --generate-notes \
            --prerelease
