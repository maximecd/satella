name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer without the leading v
        required: true
        type: string

concurrency:
  group: optimus-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  main-only:
    name: main-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Reject non-main dispatches
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "Releases may only be dispatched from main (received ${{ github.ref_name }})." >&2
          exit 1
      - name: Validate version and publication state
        if: ${{ github.ref_name == 'main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node --input-type=module -e \
            'import { normalizeReleaseVersion } from "./scripts/package-release.mjs"; normalizeReleaseVersion(process.env.RELEASE_VERSION)'
          tag_exists=false
          if gh api "repos/$REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            tag_exists=true
          fi
          release_exists=false
          if gh release view "v$RELEASE_VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            release_exists=true
          fi
          if [ "$tag_exists" = true ]; then
            echo "Tag v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          if [ "$release_exists" = true ]; then
            echo "GitHub Release v$RELEASE_VERSION already exists." >&2
            exit 1
          fi

  check:
    name: release-check
    needs: main-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp check
      - run: vp run -r typecheck

  test:
    name: release-test
    needs: main-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - name: Build connector packages required by source tests
        run: |
          vp run --filter @optimus/connector-core build
          vp run --filter @optimus/connector-ibkr build
          vp run --filter @optimus/connector-okx build
      - run: vp run -r test

  build:
    name: release-build
    needs: main-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp run -r build

  package:
    name: package-and-smoke
    needs:
      - check
      - test
      - build
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp run -r build
      - run: pnpm release:package --version "$RELEASE_VERSION" --output-dir "$RUNNER_TEMP/optimus-release"
      - run: pnpm release:smoke --artifact "$RUNNER_TEMP/optimus-release/Optimus-$RELEASE_VERSION-macOS-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: optimus-release-bundle
          path: ${{ runner.temp }}/optimus-release/Optimus-${{ inputs.version }}-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish
    needs:
      - check
      - test
      - build
      - package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: optimus-release-bundle
          path: release
      - name: Recheck immutable publication targets
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if gh api "repos/$REPOSITORY/git/ref/tags/v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Tag v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          if gh release view "v$RELEASE_VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
      - name: Create exact commit tag
        env:
          TAG: v${{ inputs.version }}
        run: |
          git tag -a "$TAG" "$GITHUB_SHA" -m "Optimus $RELEASE_VERSION"
          git push origin "$TAG"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          gh release create "$TAG" \
            "release/Optimus-$RELEASE_VERSION-macOS-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Optimus $RELEASE_VERSION" \
            --generate-notes \
            --prerelease
