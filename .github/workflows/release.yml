name: Ship Satella

on:
  workflow_dispatch: {}

concurrency:
  group: satella-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: resolve-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Reject non-main dispatches
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "Ship Satella may only be dispatched from main (received ${{ github.ref_name }})." >&2
          exit 1
      - name: Select the next patch version
        id: version
        if: ${{ github.ref_name == 'main' }}
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="$(node scripts/release-version.mjs next-release)"
          echo "Selected version ${VERSION} for commit ${GITHUB_SHA}."
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
  outputs:
    version: ${{ steps.version.outputs.version }}

  check:
    name: release-check
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp check
      - run: vp run -r typecheck

  test:
    name: release-test
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - name: Build connector packages required by source tests
        run: |
          vp run --filter @satella-app/connector-core build
          vp run --filter @satella-app/connector-ibkr build
          vp run --filter @satella-app/connector-kraken build
          vp run --filter @satella-app/connector-okx build
      - run: vp run -r test
      - run: node --test scripts/*.test.mjs

  build:
    name: release-build
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp run -r build

  package:
    name: package-and-smoke
    needs:
      - check
      - test
      - build
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - uses: pnpm/action-setup@v4
      - run: vp run -r build
      - name: Package the macOS Apple Silicon artifact
        run: |
          pnpm release:package --version "${{ needs.resolve.outputs.version }}" \
            --output-dir "$RUNNER_TEMP/satella-release"
      - name: Smoke-test the packaged application
        run: |
          pnpm release:smoke --artifact \
            "$RUNNER_TEMP/satella-release/Satella-${{ needs.resolve.outputs.version }}-macOS-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: satella-release-bundle
          path: >-
            ${{ runner.temp }}/satella-release/Satella-${{
            needs.resolve.outputs.version }}-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish-prerelease
    needs:
      - resolve
      - check
      - test
      - build
      - package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: satella-release-bundle
          path: release
      - name: Recheck immutable publication targets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/release-version.mjs assert-publishable \
            --tag "$RELEASE_VERSION" --repository "$REPOSITORY"
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create exact commit tag only after validation passed
        env:
          TAG: v${{ needs.resolve.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi
          git tag -a "$TAG" "$GITHUB_SHA" -m "Satella ${{ needs.resolve.outputs.version }}"
          git push origin "$TAG"
      - name: Publish immutable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          TAG: v${{ needs.resolve.outputs.version }}
        run: |
          gh release create "$TAG" \
            "release/Satella-$RELEASE_VERSION-macOS-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Satella $RELEASE_VERSION" \
            --generate-notes \
            --prerelease
