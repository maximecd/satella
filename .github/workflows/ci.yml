name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp check
      - run: vp run -r typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - name: Build connector packages required by source tests
        run: |
          vp run --filter @satella-app/connector-core build
          vp run --filter @satella-app/connector-ibkr build
          vp run --filter @satella-app/connector-kraken build
          vp run --filter @satella-app/connector-okx build
      - run: vp run -r test
      - run: node --test scripts/*.test.mjs

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp run -r build

  CI:
    name: CI
    if: ${{ always() }}
    needs:
      - check
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failures=0
          if [ "$CHECK_RESULT" != success ]; then
            echo "::error::check gate result: $CHECK_RESULT"
            failures=1
          fi
          if [ "$TEST_RESULT" != success ]; then
            echo "::error::test gate result: $TEST_RESULT"
            failures=1
          fi
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::build gate result: $BUILD_RESULT"
            failures=1
          fi
          exit "$failures"

  nightly:
    name: nightly
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.CI.result == 'success' }}
    needs:
      - CI
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: satella-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - uses: pnpm/action-setup@v4
      - name: Resolve the nightly version from release tags
        run: |
          VERSION="$(node scripts/release-version.mjs next-nightly)"
          echo "Packaging nightly ${VERSION} for commit ${GITHUB_SHA}."
          echo "NIGHTLY_VERSION=${VERSION}" >> "$GITHUB_ENV"
      - run: vp run -r build
      - name: Package the macOS Apple Silicon nightly
        run: |
          pnpm release:package --version "$NIGHTLY_VERSION" \
            --output-dir "$RUNNER_TEMP/satella-nightly"
      - name: Tag and publish the immutable nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${NIGHTLY_VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists." >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" "${GITHUB_SHA}" -m "Satella Nightly ${NIGHTLY_VERSION}"
          git push origin "${TAG}"
          gh release create "${TAG}" \
            "$RUNNER_TEMP/satella-nightly/Satella-${NIGHTLY_VERSION}-macOS-arm64.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Satella Nightly ${NIGHTLY_VERSION} ($(git rev-parse --short "$GITHUB_SHA"))" \
            --generate-notes \
            --prerelease
