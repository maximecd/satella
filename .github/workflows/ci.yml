name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp check
      - run: vp run -r typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - name: Build connector packages required by source tests
        run: |
          vp run --filter @optimus/connector-core build
          vp run --filter @optimus/connector-ibkr build
          vp run --filter @optimus/connector-okx build
      - run: vp run -r test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .nvmrc
          cache: true
          run-install: true
      - run: vp run -r build

  CI:
    name: CI
    if: ${{ always() }}
    needs:
      - check
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failures=0
          if [ "$CHECK_RESULT" != success ]; then
            echo "::error::check gate result: $CHECK_RESULT"
            failures=1
          fi
          if [ "$TEST_RESULT" != success ]; then
            echo "::error::test gate result: $TEST_RESULT"
            failures=1
          fi
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::build gate result: $BUILD_RESULT"
            failures=1
          fi
          exit "$failures"
