name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'ci-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PNPM_VERSION: 11.21.0

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build connector packages required by source tests
        run: |
          pnpm --filter @optimus/connector-core build
          pnpm --filter @optimus/connector-ibkr build
          pnpm --filter @optimus/connector-okx build
      - run: pnpm test
      - run: pnpm test:release

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  CI:
    name: CI
    if: ${{ always() }}
    needs:
      - check
      - test
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality gate
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          TEST_RESULT: ${{ needs.test.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          failures=0
          if [ "$CHECK_RESULT" != success ]; then
            echo "::error::check gate result: $CHECK_RESULT"
            failures=1
          fi
          if [ "$TEST_RESULT" != success ]; then
            echo "::error::test gate result: $TEST_RESULT"
            failures=1
          fi
          if [ "$BUILD_RESULT" != success ]; then
            echo "::error::build gate result: $BUILD_RESULT"
            failures=1
          fi
          exit "$failures"
