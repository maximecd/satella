packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  "@astryxdesign/cli": false
  "@astryxdesign/core": true
  "@parcel/watcher": false
  electron: true
  esbuild: true
  msgpackr-extract: false

catalog:
  "@effect/platform-node": 4.0.0-rc.108
  "@effect/sql-sqlite-node": 4.0.0-rc.108
  "@effect/tsgo": 0.36.4
  "@effect/vitest": 4.0.0-rc.108
  "@testing-library/dom": 10.4.1
  "@testing-library/jest-dom": 7.0.0
  "@testing-library/react": 16.3.2
  "@testing-library/user-event": 14.6.1
  "@types/node": 26.2.0
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.4
  "@vitejs/plugin-react": 6.0.5
  effect: 4.0.0-rc.108
  jsdom: 30.0.1
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.2.9
  vite-plus: 0.2.9

overrides:
  "@effect/platform-node": "catalog:"
  "@effect/sql-sqlite-node": "catalog:"
  "@effect/vitest": "catalog:"
  "@effect/vitest>vitest": "-"
  "@types/node": "catalog:"
  effect: "catalog:"
  vite: "catalog:"
  vitest: 4.1.10

packageExtensions:
  "@effect/vitest@*":
    dependencies:
      vite-plus: "catalog:"
    peerDependenciesMeta:
      vitest:
        optional: true
  vite-plus@*:
    dependencies:
      vite: "catalog:"
